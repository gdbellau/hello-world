<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>THE CABAL</title>
    <meta name="description" content="2080. Run a megacorp. Field a squad of cyberpunk agents." />
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="hud" hidden>

      </div>
